spring:
  #environment
  profiles:
    active: dev
#  jackson:
#    serialization:
#      write_dates_as_timestamps: false
#    time-zone: GMT+0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SQL_HOST:localhost}:${SQL_PORT:3306}/shopfee?createDatabaseIfNotExist=true
    username: ${SQL_USERNAME:root}
    password: ${SQL_PASSWORD:hcmute}

  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate.ddl-auto: update
    properties.hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  #mail
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_ID}
    password: ${EMAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        mime:
          charset: UTF
        smtp:
          writetimeout: 10000
          connectiontimeout: 10000
          timeout: 10000
          auth: true
          starttls:
            enabled: true
            required: true
    verify:
      host: ${VERIFY_EMAIL_HOST}
  # quartz
  quartz:
    jdbc:
      schema: classpath:sql/schema-mysql.sql
      comment-prefix:
        - "#"
        - "--"
      initialize-schema: always
    job-store-type: jdbc

  # kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
    producer:
      acks: -1
#      retries: 1
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties.[enable.idempotence]: true
      properties.[max.in.flight.requests.per.connection]: 5

    consumer:
      auto-offset-reset: earliest
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
#      group-id: group-01
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.hcmute.shopfee.*
  elasticsearch:
    host: ${ELASTICSEARCH_HOST}
    port: ${ELASTICSEARCH_PORT}

  cache:
    type: redis

  servlet:
    multipart:
      file-size-threshold: 2KB
      max-file-size: 20MB
      max-request-size: 20MB

  main:
    allow-bean-definition-overriding: true

elasticsearch:
  index.name: order

# swagger
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    configUrl: /openapi/swagger-config
    url: /openapi
  api-docs.path: /openapi

# security
security:
  jwt:
    accessTokenKey: ${ACCESS_TOKEN_KEY}
    refreshTokenKey: ${REFRESH_TOKEN_KEY}

#port server
server:
  port: ${SERVER_PORT}

# image cloud
cloudinary:
  cloud_name: ${CLOUDINARY_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

# goong
goong:
  api_key: ${GOONG_API_KEY}

# ahamove:
ahamove:
  api_key: ${AHAMOVE_API_KEY}
  token: ${AHAMOVE_TOKEN}
#  module-name: vna
#  api-version: 1.0.0

# vnpay
vnpay:
  secret_key: ${VNPAY_SECRET_KEY}
  tmn_code: ${VNPAY_TMN_CODE}

# zalopay
zalo_pay:
  app_id: ${ZALO_PAY_APP_ID}
  key1: ${ZALO_PAY_KEY_1}
  key2: ${ZALO_PAY_KEY_2}
  callback_url: ${ZALO_PAY_CALLBACK_URL}


app:
  username_admin: ${APP_USERNAME_ADMIN}
  password_admin: ${APP_PASSWORD_ADMIN}
  redis_host: ${REDIS_HOST}
  redis_port: ${REDIS_PORT}